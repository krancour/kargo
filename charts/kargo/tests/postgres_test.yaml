suite: postgres/statefulset.yaml
values:
  - ../test/values-unittest.yaml
templates:
  - templates/postgres/statefulset.yaml
tests:
  - it: renders the Postgres StatefulSet by default
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: StatefulSet
      - equal:
          path: metadata.name
          value: kargo-postgres
      - equal:
          path: spec.template.spec.containers[0].image
          value: postgres:17-alpine
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: POSTGRES_HOST_AUTH_METHOD
            value: trust
      - lengthEqual:
          path: spec.volumeClaimTemplates
          count: 1
      - equal:
          path: spec.volumeClaimTemplates[0].spec.resources.requests.storage
          value: 1Gi

  - it: is not rendered when postgres is disabled and database.url is set
    set:
      postgres.enabled: false
      database.url: postgres://x/y
    asserts:
      - hasDocuments:
          count: 0

---
suite: postgres/service.yaml
values:
  - ../test/values-unittest.yaml
templates:
  - templates/postgres/service.yaml
tests:
  - it: renders the Postgres Service by default
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: Service
      - equal:
          path: metadata.name
          value: kargo-postgres
      - equal:
          path: spec.type
          value: ClusterIP
      - equal:
          path: spec.ports[0].port
          value: 5432
      - equal:
          path: spec.ports[0].targetPort
          value: postgres

  - it: is not rendered when postgres is disabled and database.url is set
    set:
      postgres.enabled: false
      database.url: postgres://x/y
    asserts:
      - hasDocuments:
          count: 0

---
suite: postgres/service-account.yaml
values:
  - ../test/values-unittest.yaml
templates:
  - templates/postgres/service-account.yaml
tests:
  - it: renders the Postgres ServiceAccount by default
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: ServiceAccount
      - equal:
          path: metadata.name
          value: kargo-postgres

  - it: applies global ServiceAccount annotations
    set:
      global.serviceAccount.annotations:
        foo: bar
    asserts:
      - equal:
          path: metadata.annotations.foo
          value: bar

  - it: applies postgres.serviceAccount labels
    set:
      postgres.serviceAccount.labels:
        foo: bar
    asserts:
      - equal:
          path: metadata.labels.foo
          value: bar

  - it: is not rendered when postgres is disabled and database.url is set
    set:
      postgres.enabled: false
      database.url: postgres://x/y
    asserts:
      - hasDocuments:
          count: 0
