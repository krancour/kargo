# Documentation:
# * https://docs.github.com/en/code-security/supply-chain-security/keeping-your-dependencies-updated-automatically/enabling-and-disabling-dependabot-version-updates
# * https://docs.github.com/en/code-security/supply-chain-security/keeping-your-dependencies-updated-automatically/configuration-options-for-dependency-updates
#
# Dependabot only ever reads this file from the repository's default branch.
# Coverage of the release branches is therefore expressed here, using
# target-branch. Because the layout of the repository differs from one release
# branch to the next, each branch's Go modules are enumerated separately.
#
# Release branches take patch and minor updates only. Major version bumps are
# ignored there, so they land on main alone.
#
# Each branch runs on its own day of the week so that update PRs arrive a
# branch at a time rather than all at once.

################################################################################
################################################################################
#
# IMPORTANT: There is an exception to the schedule. Every time changes
# to this file are merged to main, dependabot will re-evaluate dependencies on
# all affected branches and a flurry of PRs will ensue. It is therefore suggested
# that changes to this file be batched. Fewer, larger updates will produce less
# noise than many small, frequent updates would.
#
# IMPORTANT: It may seem like we are blocking many dependencies from being
# updated, but crucially, blocking the ones that cannot succeed improves the
# changes of clean dependency bumps for those that can.
#
################################################################################
################################################################################

#
# Go itself is excluded from the docker ecosystem. Its version pins serve two
# distinct roles -- the toolchain that builds shipped artifacts, and the older,
# golangci-lint-capped toolchain that runs unit tests, linters, and codegen --
# and most of them live in the workflows, where the docker ecosystem cannot see
# them at all. Dependabot can neither tell the roles apart nor move a role's
# pins in lock-step, so raising Go is a coordinated, whole-branch change made
# by hand. The comment at each pin says which role it serves.
#
# golangci-lint is excluded from the gomod ecosystem on the release branches
# that still have a hack/tools module. Nothing is built from that module;
# hack/tools.mk greps it for the version of the prebuilt linter binary to
# install. Raising the linter on a stable branch changes what CI enforces and
# can only turn up new findings in code that is already frozen.
#
# google.golang.org/api is excluded on the release branches because its own
# go.mod pins google.golang.org/grpc and google.golang.org/protobuf. Raising it
# drags both past the versions frozen here, so ignoring those two by name does
# not hold on its own.
#
# golang.org/x/*, code.gitea.io/sdk/gitea and github.com/go-openapi/* are
# excluded on release-1.8 and release-1.9. Every current release of the x/
# family declares go 1.26, as do gitea from v0.25.0 on and most of go-openapi.
# Requiring one raises the root go directive past the go 1.25.14 toolchain
# those two branches test with, which fails every Go job at module load rather
# than at compile. The cost is that x/crypto and x/net security patches no
# longer reach them; lifting this means raising Go on the branch, which is the
# coordinated change described above.
#
# go-openapi is ignored by wildcard although strfmt has not yet moved to go
# 1.26, because swag has split into a dozen submodules and naming the affected
# ones individually goes stale as that continues. The wildcard also holds back
# the go-openapi modules that jumped straight from 0.x to v1.0.0, which
# Dependabot classifies as a patch and the branches' semver-major ignore
# therefore does not catch.
#
# github.com/go-swagger/go-swagger is excluded on release-1.8 and release-1.9
# for the same reason as the x/ family: v0.36.6 declares go 1.26, so
# check-codegen cannot even install it under go 1.25.14. It is worth naming
# separately because raising Go on those branches would not be enough to make
# it safe -- go-swagger generates pkg/client/generated, and three minor
# versions of it rewrite every model there.
#
# github.com/ktrysmt/go-bitbucket is excluded on release-1.8 through
# release-1.10. v0.10.0 changes NewOAuthbearerToken to return two values, which
# does not compile against the call site in pkg/gitprovider/bitbucket. main and
# release-1.11 replaced this library with a generated client, so there is no
# upstream fix to backport.
#
# github.com/jferrl/go-githubauth is excluded on release-1.8 alone. v1.7.0 drops
# WithEnterpriseURLs and stops aliasing go-github's InstallationTokenOptions.
# release-1.9 and later already carry v1.7.0 and the code that suits it.
version: 2
updates:
  # ----------------------------- main -----------------------------

  - package-ecosystem: "github-actions"
    # "/" covers .github/workflows and a root-level action.yaml only, so each
    # composite action's directory is listed explicitly. Add a line here when
    # adding an action.
    directories:
    - "/"
    - "/.github/actions/setup-go"
    schedule:
      interval: "weekly"
      day: "sunday"
    commit-message:
      prefix: "chore(deps):"

  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "sunday"
    ignore:
    - dependency-name: "golang"
    commit-message:
      prefix: "chore(deps):"

  - package-ecosystem: "npm"
    directory: "/ui"
    versioning-strategy: increase
    schedule:
      interval: "monthly"
    commit-message:
      prefix: "chore(deps):"
    groups:
      js-patch:
        update-types:
        - "patch"
      js-minor:
        update-types:
        - "minor"
      js-major:
        update-types:
        - "major"

  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "sunday"
    commit-message:
      prefix: "chore(deps):"
    groups:
      go-patch:
        update-types:
        - "patch"
      go-minor:
        update-types:
        - "minor"
      go-major:
        update-types:
        - "major"

  - package-ecosystem: "gomod"
    directory: "/api"
    schedule:
      interval: "weekly"
      day: "sunday"
    commit-message:
      prefix: "chore(deps/api):"
    groups:
      go-patch:
        update-types:
        - "patch"
      go-minor:
        update-types:
        - "minor"
      go-major:
        update-types:
        - "major"

  - package-ecosystem: "gomod"
    directories:
    - "/pkg/x/client/fidelity"
    - "/pkg/x/client/generated"
    schedule:
      interval: "weekly"
      day: "sunday"
    commit-message:
      prefix: "chore(deps/client):"
    groups:
      go-patch:
        update-types:
        - "patch"
      go-minor:
        update-types:
        - "minor"
      go-major:
        update-types:
        - "major"

